@if (auth.ready()) {
  @if (auth.user()) {
    <app-sidebar />
    @switch (store.activeView()) {
      @case ('chat') {
        <app-chat-panel />
      }
      @case ('agents') {
        <app-agents-page />
      }
      @case ('docs') {
        <app-docs-page />
      }
      @case ('memory') {
        <app-memory-page />
      }
      @case ('tools') {
        <app-tools-page />
      }
    }
  } @else {
    <app-auth-page />
  }
}
