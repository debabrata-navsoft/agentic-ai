<header>
  <div>
    <h1>Synora AI</h1>
    <p class="tagline">Built and run on this computer. No external AI.</p>
  </div>
  <nav>
    <button [class.active]="tab() === 'ask'" (click)="tab.set('ask')">Ask documents</button>
    <button [class.active]="tab() === 'write'" (click)="tab.set('write')">
      Write with my model
    </button>
  </nav>
</header>

<!-- Both stay mounted so switching tabs keeps the conversation and generated text. -->
<app-ask [hidden]="tab() !== 'ask'" />
<app-write [hidden]="tab() !== 'write'" />
