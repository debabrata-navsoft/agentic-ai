@if (error(); as err) {
  <p class="error">{{ err }}</p>
}
@for (u of users(); track u.id) {
  <div class="card" [class.disabled]="u.disabled">
    <div class="card-head">
      <strong class="truncate">{{ u.name }}</strong>
      @if (u.role === 'admin') {
        <span class="badge">admin</span>
      }
      @if (u.disabled) {
        <span class="badge off">disabled</span>
      }
    </div>
    <p class="truncate">{{ u.email }}</p>
    @if (u.id === auth.user()?.id) {
      <p class="you">This is you</p>
    } @else {
      <div class="actions">
        <button (click)="update(u, { role: u.role === 'admin' ? 'user' : 'admin' })">
          {{ u.role === 'admin' ? 'Make user' : 'Make admin' }}
        </button>
        <button [class.danger]="!u.disabled" (click)="update(u, { disabled: !u.disabled })">
          {{ u.disabled ? 'Enable' : 'Disable' }}
        </button>
      </div>
    }
  </div>
} @empty {
  @if (!error()) {
    <p class="empty">Loading users…</p>
  }
}
