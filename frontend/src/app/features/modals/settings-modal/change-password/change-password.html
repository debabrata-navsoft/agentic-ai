<form novalidate (submit)="submit($event)">
  @if (error(); as err) {
    <p class="msg err" role="alert">{{ err }}</p>
  }
  @if (done()) {
    <p class="msg ok" role="status">Password changed. Your other devices have been signed out.</p>
  }

  <label>
    <span>Current password</span>
    <input
      type="password"
      autocomplete="current-password"
      placeholder="Your current password"
      [class.invalid]="submitted() && errors().current"
      [value]="current()"
      (input)="current.set(value($event))"
    />
    @if (submitted() && errors().current; as err) {
      <small>{{ err }}</small>
    }
  </label>
  <label>
    <span>New password</span>
    <input
      type="password"
      autocomplete="new-password"
      placeholder="At least 8 characters"
      [class.invalid]="submitted() && errors().next"
      [value]="next()"
      (input)="next.set(value($event))"
    />
    @if (submitted() && errors().next; as err) {
      <small>{{ err }}</small>
    }
  </label>
  <label>
    <span>Confirm new password</span>
    <input
      type="password"
      autocomplete="new-password"
      placeholder="Type the new password again"
      [class.invalid]="submitted() && errors().confirm"
      [value]="confirm()"
      (input)="confirm.set(value($event))"
    />
    @if (submitted() && errors().confirm; as err) {
      <small>{{ err }}</small>
    }
  </label>

  <button type="submit" [disabled]="busy()">
    {{ busy() ? 'Changing…' : 'Change password' }}
  </button>
</form>
