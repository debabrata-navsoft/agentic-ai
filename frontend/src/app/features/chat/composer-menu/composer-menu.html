<button
  type="button"
  class="trigger"
  title="Add files or start an agent chat"
  aria-label="Add files or start an agent chat"
  aria-haspopup="menu"
  [attr.aria-expanded]="!!placement()"
  (click)="toggle()"
>
  <svg lucideIcon="plus" size="18"></svg>
</button>
<input #kbPicker type="file" multiple hidden [accept]="kbAccept()" (change)="onKbPick($event)" />

@if (placement(); as p) {
  <div class="menu" role="menu" [class.down]="!p.up" [style.--room.px]="p.room">
    <div class="items">
      @for (item of items(); track $index) {
        @if (item.heading) {
          <div class="heading">{{ item.heading }}</div>
        }
        <button
          type="button"
          [attr.role]="item.active === undefined ? 'menuitem' : 'menuitemradio'"
          [attr.aria-checked]="item.active"
          (click)="choose(item)"
        >
          <svg [lucideIcon]="item.icon" size="16"></svg>
          <span class="label">{{ item.label }}</span>
          <span class="hint truncate">{{ item.hint }}</span>
          @if (item.active) {
            <svg class="check" lucideIcon="check" size="15"></svg>
          }
        </button>
      } @empty {
        <p class="empty">No matches</p>
      }
    </div>
    <input
      #search
      class="search"
      placeholder="Type to search actions, modes & agents"
      [value]="query()"
      (input)="query.set($any($event.target).value)"
      (keydown.enter)="items().length && choose(items()[0])"
    />
  </div>
}
