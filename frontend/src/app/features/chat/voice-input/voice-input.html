@if (supported) {
  @let label = listening() ? 'Stop voice input' : 'Voice input';
  <button
    type="button"
    class="mic"
    [class.listening]="listening()"
    [title]="label"
    [attr.aria-label]="label"
    [attr.aria-pressed]="listening()"
    (click)="toggle()"
  >
    <svg [lucideIcon]="listening() ? 'square' : 'audio-lines'" [size]="listening() ? 14 : 18"></svg>
  </button>
}
